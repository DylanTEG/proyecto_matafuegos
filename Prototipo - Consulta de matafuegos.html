<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consulta de matafuegos - Prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#E8ECEF;--surface:#F6F8F9;--ink:#17212B;--muted:#55636F;--line:#C3CCD3;--steel:#2B4A63;
--p1:#DDE3E8;--p2:#C9D2D9;--engr:rgba(255,255,255,.7);
--ok:#1E7B4A;--warn:#F2B01E;--bad:#B3261E;--baja:#3A3F45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#12181D;--surface:#1B232A;--ink:#E7ECEF;--muted:#93A1AC;--line:#2F3B45;--steel:#7FB0D6;
--p1:#2A343C;--p2:#222B32;--engr:rgba(0,0,0,.7);
--ok:#2FA568;--warn:#F2B01E;--bad:#E5534B;--baja:#5A636B}}
:root[data-theme="dark"]{--bg:#12181D;--surface:#1B232A;--ink:#E7ECEF;--muted:#93A1AC;--line:#2F3B45;--steel:#7FB0D6;
--p1:#2A343C;--p2:#222B32;--engr:rgba(0,0,0,.7);--ok:#2FA568;--warn:#F2B01E;--bad:#E5534B;--baja:#5A636B}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font:700 2rem/1.1 "Barlow Condensed",Impact,sans-serif;margin:.75rem 0 .35rem}
.sub{color:var(--muted);margin:0 0 1.25rem}
.tag{display:inline-block;font-size:.85rem;border:1px solid var(--line);border-radius:99px;padding:.1rem .7rem;color:var(--muted);background:var(--surface)}
.plate{background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:6px;padding:1rem;display:flex;gap:.75rem;flex-wrap:wrap}
.plate input{flex:1 1 220px;min-width:0;font:600 2rem/1.2 "Barlow Condensed",Impact,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 0 var(--engr);background:transparent;border:0;border-bottom:2px solid var(--steel);padding:.25rem .1rem;outline:none}
.plate input::placeholder{color:var(--muted);opacity:.7}
button{font:600 1rem "Source Sans 3",sans-serif;cursor:pointer;border-radius:6px}
.go{background:var(--steel);color:var(--bg);border:0;padding:.7rem 1.4rem}
:root:not([data-theme="dark"]) .go{color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.demo{margin:.9rem 0 1.5rem;color:var(--muted);font-size:.95rem}
.chip{font:600 .95rem "Barlow Condensed",sans-serif;letter-spacing:.08em;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:.25rem .6rem;margin:.2rem .3rem .2rem 0}
.status{border-radius:6px;padding:1.25rem 1.25rem 1.1rem;margin-bottom:1rem;color:#fff}
.status.ok{background:var(--ok)}.status.bad{background:var(--bad)}.status.baja{background:var(--baja)}
.status.warn{background:var(--warn);color:#17212B}
.status b{display:block;font:700 clamp(2.6rem,12vw,4.2rem)/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em}
.status p{margin:.4rem 0 0;font-size:1.05rem}
.serial{font:600 1.1rem "Barlow Condensed",sans-serif;letter-spacing:.1em;color:var(--muted);margin:0 0 .5rem}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
dl div{padding:.7rem 1rem;border-bottom:1px solid var(--line)}
dt{font-size:.9rem;color:var(--muted)}
dd{margin:0;font-weight:600}
dd small{display:block;font-weight:400;color:var(--muted)}
h2{font:700 1.4rem "Barlow Condensed",sans-serif;margin:1.5rem 0 .5rem}
ul.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
ul.hist li{padding:.6rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:1rem;flex-wrap:wrap}
ul.hist li:last-child{border-bottom:0}
ul.hist span:first-child{min-width:6.5rem;color:var(--muted)}
.empty{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:6px;padding:1rem}
.empty p{margin:.3rem 0 0;color:var(--muted)}
</style>
</head>
<body>
<main>
<span class="tag">Prototipo con datos de ejemplo</span>
<h1>Consultá un matafuegos por su número de serie</h1>
<p class="sub">Ingresá el código grabado en el cuello del cilindro. No importan las mayúsculas, los espacios ni los guiones.</p>

<div class="plate">
  <input id="q" type="text" placeholder="MF-2023-04817" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Número de serie">
  <button class="go" id="go">Buscar</button>
</div>
<div class="demo">Probá con: <span id="chips"></span></div>
<section id="out" aria-live="polite"></section>
</main>

<script>
const T=new Date();T.setHours(0,0,0,0);
const ago=(y,m,d=0)=>{const x=new Date(T);x.setFullYear(x.getFullYear()-y);x.setMonth(x.getMonth()-m);x.setDate(x.getDate()-d);return x};
const add=(dt,y,m=0)=>{const x=new Date(dt);x.setFullYear(x.getFullYear()+y);x.setMonth(x.getMonth()+m);return x};
const fmt=d=>d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
const days=d=>Math.round((d-T)/864e5);
const rel=n=>n<0?'vencida hace '+(-n)+' días':n===0?'vence hoy':'faltan '+n+' días';

const DB={
MF202304817:{n:'MF-2023-04817',ag:'Polvo químico seco ABC',cap:'5 kg',cl:'A, B, C',fab:ago(3,0),fb:'Extintores del Plata S.A.',rec:ago(0,4),ph:ago(3,0),emp:'Recargas Norte S.R.L.',id:'PB-07, hall de entrada',dom:'Av. Rivadavia 1234, CABA'},
MF202201593:{n:'MF-2022-01593',ag:'Dióxido de carbono (CO2)',cap:'5 kg',cl:'B, C',fab:ago(4,0),fb:'Extintores del Plata S.A.',rec:ago(0,11,10),ph:ago(1,0),emp:'Seguridad Austral',id:'SC-02, sala de servidores',dom:'Calle Tucumán 560, CABA'},
MF201900276:{n:'MF-2019-00276',ag:'Polvo químico seco ABC',cap:'10 kg',cl:'A, B, C',fab:ago(7,0),fb:'Fuegotec Argentina',rec:ago(1,1),ph:ago(2,0),emp:'Recargas Norte S.R.L.',id:'P1-03, depósito',dom:'Av. Rivadavia 1234, CABA'},
MF200600941:{n:'MF-2006-00941',ag:'Polvo químico seco ABC',cap:'5 kg',cl:'A, B, C',fab:ago(20,2),fb:'Fuegotec Argentina',rec:ago(0,3),ph:ago(1,0),emp:'Seguridad Austral',id:'PB-01, cochera',dom:'Calle Tucumán 560, CABA'}
};

function evaluar(m){
  const v=[{k:'Recarga anual',f:add(m.rec,0,12)},{k:'Prueba hidrostática',f:add(m.ph,5)},{k:'Vida útil del cilindro',f:add(m.fab,20)}];
  v.forEach(x=>x.d=days(x.f));
  const first=v.slice().sort((a,b)=>a.d-b.d)[0];
  let cls,txt;
  if(first.d<0&&first.k==='Vida útil del cilindro'){cls='baja';txt='DAR DE BAJA'}
  else if(first.d<0){cls='bad';txt='VENCIDO'}
  else if(first.d<=30){cls='warn';txt='POR VENCER'}
  else{cls='ok';txt='HABILITADO'}
  return{v,first,cls,txt};
}

function render(m){
  const e=evaluar(m),[r,p,u]=e.v;
  const why=e.first.d<0?e.first.k+': '+rel(e.first.d)+' ('+fmt(e.first.f)+')'
    :'Vence primero: '+e.first.k.toLowerCase()+', el '+fmt(e.first.f)+' ('+rel(e.first.d)+')';
  const f=(t,val,sub)=>'<div><dt>'+t+'</dt><dd>'+val+(sub?'<small>'+sub+'</small>':'')+'</dd></div>';
  const ev=[[m.fab,'Fabricación',m.fb],[m.ph,'Prueba hidrostática',m.emp],[m.rec,'Recarga anual',m.emp],[add(m.rec,-1),'Recarga anual',m.emp]]
    .sort((a,b)=>b[0]-a[0]).map(x=>'<li><span>'+fmt(x[0])+'</span><span>'+x[1]+'</span><span>'+x[2]+'</span></li>').join('');
  out.innerHTML=
   '<div class="status '+e.cls+'"><b>'+e.txt+'</b><p>'+why+'</p></div>'+
   '<p class="serial">N.º de serie '+m.n+'</p><dl>'+
   f('Agente extintor',m.ag)+f('Clases de fuego',m.cl)+f('Capacidad y agente',m.cap+' de '+m.ag.toLowerCase())+
   f('Empresa recargadora',m.emp)+f('Próxima recarga',fmt(r.f),rel(r.d))+f('Próxima P.H.',fmt(p.f),rel(p.d))+
   f('Identificación',m.id)+f('Domicilio de instalación',m.dom)+f('Fabricante original',m.fb)+
   f('Fecha de fabricación',fmt(m.fab))+f('Vencimiento de vida útil',fmt(u.f),rel(u.d))+
   '</dl><h2>Historial</h2><ul class="hist">'+ev+'</ul>';
}

function buscar(){
  const raw=q.value,k=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!k){out.innerHTML='<div class="empty"><b>Ingresá un número de serie</b><p>Está grabado en el cuello del cilindro.</p></div>';return}
  if(DB[k]){render(DB[k]);return}
  out.innerHTML='<div class="empty"><b>No encontramos ese número de serie</b><p></p></div>';
  out.querySelector('p').textContent='Revisá que "'+raw.trim()+'" esté completo y sin letras cambiadas (por ejemplo O y 0). Si está bien, el matafuegos todavía no fue registrado.';
}

const q=document.getElementById('q'),out=document.getElementById('out');
document.getElementById('go').onclick=buscar;
q.addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
Object.values(DB).forEach(m=>{const b=document.createElement('button');b.className='chip';b.textContent=m.n;
  b.onclick=()=>{q.value=m.n;buscar()};document.getElementById('chips').appendChild(b)});
</script>
</body>
</html>
